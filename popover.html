<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TypeMeter Popover</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <style>
      :root {
        --bg: rgba(12, 18, 32, 0.86);
        --card: #0f1627;
        --text: #e6eaf2;
        --muted: #8ea2c6;
        --accent: #38c8ff;
        --accent-negative: #f87171;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .panel {
        width: 100%;
        height: 100%;
        background: var(--bg);
        backdrop-filter: blur(12px) saturate(1.1);
        -webkit-backdrop-filter: blur(12px) saturate(1.1);
        color: var(--text);
        font: 13px/1.4 ui-sans-serif, system-ui, Inter, Segoe UI, Roboto;
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .title {
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        background: transparent;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), #7f9cff);
        color: #05121c;
        font-weight: 700;
      }
      main {
        padding: 12px;
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr;
      }
      .card {
        background: var(--card);
        padding: 10px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .big {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
      }
      .row.double {
        gap: 12px;
      }
      .row.double .metric {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex: 1 1 0;
        color: var(--text);
      }
      .row.double .metric span {
        color: var(--muted);
      }
      footer {
        margin-top: auto;
        padding: 10px 12px;
        display: flex;
        gap: 8px;
      }
      .pill {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
      }
      .sparkline {
        position: relative;
        width: 240px;
        height: 60px;
      }
      .sparkline canvas {
        width: 100% !important;
        height: 100% !important;
      }
      .insights-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .insights-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .insight {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text);
      }
      .insight-icon {
        font-size: 14px;
        line-height: 1;
      }
      .insight-text {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header>
        <div class="title">TypeMeter</div>
        <button id="close" class="btn" title="Close (Esc)">✕</button>
      </header>

      <main>
        <div class="card">
          <div class="row">
            <div>Total Keystrokes (today)</div>
            <div class="pill" id="state">Tracking</div>
          </div>
          <div class="big" id="total">0</div>
          <div class="row double">
            <div class="metric">
              <span>Backspace</span><strong id="backs">0</strong>
            </div>
            <div class="metric">
              <span>Enter</span><strong id="ent">0</strong>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="row">
            <div>Keys / minute</div>
            <div>last 60s</div>
          </div>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div class="big" id="kpm">0</div>
            <div class="sparkline">
              <canvas
                id="popover-kpm-chart"
                aria-label="Keys per minute trend"
              ></canvas>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="insights-title">Quick insights</div>
          <div class="insights-grid">
            <div class="insight">
              <span class="insight-icon" aria-hidden="true">⚡</span>
              <span class="insight-text" id="insight-energy"
                >0 kcal burned</span
              >
            </div>
            <div class="insight">
              <span class="insight-icon" aria-hidden="true">💪</span>
              <span class="insight-text" id="insight-workout"
                >0 kg pressed</span
              >
            </div>
            <div class="insight">
              <span class="insight-icon" aria-hidden="true">🧭</span>
              <span class="insight-text" id="insight-travel"
                >0 m travelled</span
              >
            </div>
            <div class="insight">
              <span class="insight-icon" aria-hidden="true">📝</span>
              <span class="insight-text" id="insight-writing">
                0 pages today
              </span>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <button id="open-dashboard" class="btn primary">Open Dashboard</button>
        <button id="pause" class="btn">Pause</button>
      </footer>
    </div>

    <script type="importmap">
      {
        "imports": {
          "chart.js/auto": "./node_modules/chart.js/auto/auto.js",
          "chart.js": "./node_modules/chart.js/dist/chart.esm.js",
          "@kurkle/color": "./node_modules/@kurkle/color/dist/color.esm.js"
        }
      }
    </script>
    <script type="module">
      import { SparklineChart } from "./scripts/sparkline.js";
      import {
        calculateFunInsights,
        formatNumber,
      } from "./scripts/calculations.js";

      let paused = false;
      let isWayland = false;
      let kpmSparkline = null;
      const kpmChartCanvas = document.getElementById("popover-kpm-chart");

      window.typemeter.getStats();

      window.typemeter.onStatsUpdate((data) => {
        const {
          stats,
          todayStats,
          kpm,
          kpmSeries,
          paused: p,
          isWayland: wayland,
        } = data;

        if (wayland !== undefined) {
          isWayland = wayland;
          if (isWayland) {
            document.getElementById("state").title =
              "Wayland: Only tracks keys when this window is focused";
          }
        }

        document.getElementById("total").textContent = formatNumber(
          todayStats.total || 0
        );
        document.getElementById("backs").textContent = formatNumber(
          todayStats.backspace || 0
        );
        document.getElementById("ent").textContent = formatNumber(
          todayStats.enter || 0
        );
        document.getElementById("kpm").textContent = formatNumber(kpm || 0);

        if (Array.isArray(kpmSeries)) {
          ensureSparkline();
          kpmSparkline?.update(kpmSeries);
        }

        updateInsights(stats, todayStats);

        if (p !== undefined) {
          paused = p;
          updatePauseUI();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          window.typemeter.closePopover();
          return;
        }

        if (isWayland && !paused) {
          let keyType = "normal";
          if (e.key === "Backspace") keyType = "backspace";
          else if (e.key === "Enter") keyType = "enter";
          else if (e.key === "Delete") keyType = "delete";
          else if (e.key === " ") keyType = "space";

          window.typemeter.sendKeyPress(keyType);
        }
      });

      window.typemeter.onTracking(({ paused: p }) => {
        paused = p;
        updatePauseUI();
      });

      document.getElementById("pause").addEventListener("click", () => {
        window.typemeter.toggleTracking();
      });

      document
        .getElementById("open-dashboard")
        .addEventListener("click", () => {
          window.typemeter.openDashboard();
          window.typemeter.closePopover();
        });

      document.getElementById("close").addEventListener("click", () => {
        window.typemeter.closePopover();
      });

      updatePauseUI();

      function updatePauseUI() {
        const stateEl = document.getElementById("state");
        const pauseBtn = document.getElementById("pause");

        if (paused) {
          stateEl.textContent = "Paused";
          pauseBtn.textContent = "Resume";
          stateEl.style.background = "rgba(255, 100, 100, 0.2)";
        } else {
          stateEl.textContent = isWayland ? "Tracking (Focused)" : "Tracking";
          pauseBtn.textContent = "Pause";
          stateEl.style.background = "rgba(56, 200, 255, 0.2)";
        }
      }

      function getCssVar(name) {
        return getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();
      }

      function ensureSparkline() {
        if (kpmSparkline || !kpmChartCanvas) return;
        const colorUp = getCssVar("--accent") || "#38c8ff";
        const colorDown = getCssVar("--accent-negative") || "#f87171";
        kpmSparkline = new SparklineChart(kpmChartCanvas, {
          colorUp,
          colorDown,
          tooltipLabel: "Keys / min",
        });
      }

      function updateInsights(stats = {}, todayStats = {}) {
        if (!stats || !todayStats) return;
        const insights = calculateFunInsights(stats, todayStats);

        setText(
          "insight-energy",
          `${formatNumber(insights.energy.calories, 1)} kcal burned`
        );
        setText(
          "insight-workout",
          `${formatNumber(insights.workout.forceKg, 1)} kg pressed today`
        );
        setText(
          "insight-travel",
          `${insights.travel.travelValue} travelled today`
        );
        setText(
          "insight-writing",
          `${formatNumber(insights.writing.todayPages, 1)} pages today`
        );
      }

      function setText(id, text) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }
    </script>
  </body>
</html>
